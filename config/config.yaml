# Void Application Configuration
# Created by Yinuo

app:
  name: Void
  version: 1.0.0
  author: Yinuo
  debug: false
  log_level: INFO

ui:
  theme: dark
  refresh_rate: 1.0
  max_history: 100
  show_disclaimer: true
  custom_menu: false

network:
  timeout: 30
  max_retries: 3
  user_agent: Void/1.0

discord:
  enabled: false
  command_prefix: "!"

osint:
  cache_enabled: true
  cache_duration: 3600

generators:
  default_password_length: 20
  default_uuid_version: 4

crypto:
  default_hash_algorithm: sha256
  default_token_length: 32

customization:
  enable_themes: true
  enable_menu_customization: true
  save_preferences: true